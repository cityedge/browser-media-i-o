<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>ローカルHTML起動の開発用試験</title>
<style>body{font:16px sans-serif;max-width:850px;margin:32px auto;padding:0 16px}button{margin:8px 8px 8px 0}pre{white-space:pre-wrap;background:#eee;padding:16px}</style>
<h1>ローカルHTML起動の開発用試験</h1>
<p>正式な配布アプリではありません。index.htmlを直接開き、ブラウザと検証結果を記録してください。</p>
<p>入力確認には、開発手順で生成した reference.mp4 を選択します。</p>
<input id="source" type="file" accept="video/mp4">
<button id="read">入力情報と5秒位置を確認</button>
<p>入出力チェックは、1秒の映像・無音PCMからMP4を作成して再読込し、生成WAVからMP3を作成します。</p>
<button id="convert">入出力チェック</button>
<button id="save-mp4">MP4を保存</button>
<button id="save-mp3">MP3を保存</button>
<pre id="result">未実行</pre>
<script src="./standalone.js"></script>
<script src="./app.js"></script>
</html>
